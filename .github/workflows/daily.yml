name: Daily job fetch

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch, filter, score
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python pipeline/build.py
      - name: Commit data
        run: |
          git config user.name "jobhunt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/jobs.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) jobs refresh"
          git pull --rebase --autostash origin main
          git push
